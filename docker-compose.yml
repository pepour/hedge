services:
  web:
    build: .
    image: btc-rail-desk:latest
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-80}:43187"
    environment:
      NODE_ENV: production
      PORT: "43187"
      HOSTNAME: 0.0.0.0
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:43187').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
